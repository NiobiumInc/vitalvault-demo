<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
:root{
  --paper:#FAF8F4;--card:#FFFFFF;--ink:#293730;--ink-soft:#5C6B62;--hair:#ECE8E0;
  --sage:#7C9885;--sage-deep:#48624F;--sage-tint:#EDF2EE;
  --slate:#3F5B6B;--slate-soft:#5E7E92;--slate-tint:#EAF0F3;--mist:#9DBED0;
  --amber:#E2A33C;--amber-deep:#9A7426;--amber-tint:#FAF0DC;--rose:#D89A93;--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E5E2DB;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:24px 12px;}
.phone{width:390px;max-width:100%;background:var(--paper);border-radius:40px;overflow:hidden;
  box-shadow:0 16px 50px rgba(41,55,48,.18),0 3px 10px rgba(41,55,48,.09);position:relative;}
.notch{height:30px;display:flex;align-items:center;justify-content:center;}
.notch::after{content:"";width:118px;height:6px;border-radius:6px;background:#dcd8d0;}
.demobar{background:#2E3A34;color:#cfdbd2;font-size:10.5px;text-align:center;padding:6px 14px;line-height:1.4;}
.demobar b{color:#fff;font-weight:600;}
.viewport{height:752px;position:relative;overflow:hidden;}
.view{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;background:var(--paper);
  transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .28s ease;}
.view::-webkit-scrollbar{width:0}
.view.enter-right{transform:translateX(100%);}
.view.enter-left{transform:translateX(-26%);opacity:.4;}
.wrap{padding:4px 20px 40px;}
.nav{display:flex;align-items:center;gap:6px;padding:10px 2px 12px;min-height:46px;}
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--slate);font-weight:500;cursor:pointer;background:none;border:none;padding:6px 8px 6px 0;}
.back svg{width:18px;height:18px;}
.navtitle{font-size:14px;font-weight:600;margin-left:auto;margin-right:auto;}
.navspacer{width:34px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .nm{font-family:'Fraunces',serif;font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--slate);}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--slate-soft);font-weight:600;margin-bottom:13px;}
.block{margin-top:38px;}
.sectit{font-family:'Fraunces',serif;font-size:22px;font-weight:500;letter-spacing:-.01em;margin-bottom:3px;}
.secsub{font-size:12.5px;color:var(--ink-soft);margin-bottom:17px;line-height:1.5;}

/* WELCOME */
.welcome{text-align:center;padding:46px 6px 0;}
.welcome .mark{margin:0 auto 26px;}
.welcome h1{font-family:'Fraunces',serif;font-size:30px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px;}
.welcome p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:8px;}
.welcome .priv{font-size:11.5px;color:var(--slate-soft);margin-top:18px;display:inline-flex;align-items:center;gap:6px;}
.welcome .priv svg{width:14px;height:14px;}

/* FORM */
.stepdots{display:flex;gap:6px;justify-content:center;margin:2px 0 22px;}
.stepdots b{width:7px;height:7px;border-radius:50%;background:#dcd7cc;display:inline-block;transition:background .3s,width .3s;}
.stepdots b.on{background:var(--slate);width:20px;border-radius:4px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;}
.field label .opt{color:var(--slate-soft);font-weight:400;font-size:11px;}
.field input,.field select{width:100%;height:46px;border:1px solid var(--hair);border-radius:12px;background:#fff;
  padding:0 14px;font-size:15px;font-family:'Inter';color:var(--ink);outline:none;transition:border-color .2s;}
.field input:focus,.field select:focus{border-color:var(--mist);}
.field .unit{position:relative;}
.field .unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--slate-soft);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.field .lblrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.field .lblrow label{margin-bottom:0;}
.unittoggle{display:inline-flex;background:#F0ECE3;border-radius:9px;padding:2px;gap:2px;}
.unittoggle button{border:none;background:none;font-family:'Inter';font-size:10.5px;font-weight:600;color:var(--slate-soft);
  padding:4px 9px;border-radius:7px;cursor:pointer;transition:all .15s;letter-spacing:.01em;}
.unittoggle button.sel{background:#fff;color:var(--slate);box-shadow:0 1px 2px rgba(41,55,48,.08);}
.ftin{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.ftin .unit span{font-size:11px;}
.seg-input{display:flex;gap:6px;}
.seg-input button{flex:1;height:42px;border:1px solid var(--hair);background:#fff;border-radius:10px;font-size:11px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .15s;}
.seg-input button.sel{background:var(--slate);color:#fff;border-color:var(--slate);}
.panelgroup{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:15px 15px 4px;margin-bottom:13px;}
.panelgroup .pgh{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:8px;}
.panelgroup .pgh .g{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.panelgroup .pgh .g svg{width:14px;height:14px;}
.panelgroup .pgsub{font-size:11px;color:var(--slate-soft);margin-bottom:13px;}
.btn{width:100%;height:50px;border:none;border-radius:13px;background:var(--slate);color:#fff;font-size:15px;font-weight:600;font-family:'Inter';cursor:pointer;margin-top:8px;transition:transform .15s,background .2s;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:#fff;color:var(--slate);border:1px solid var(--hair);}
.btn:disabled{background:#cdd5d0;cursor:not-allowed;}
.formfoot{display:flex;gap:10px;margin-top:18px;}
.skip{text-align:center;font-size:12px;color:var(--slate-soft);margin-top:14px;cursor:pointer;}
.err{font-size:11px;color:#a3492d;margin-top:6px;display:none;}
.err.show{display:block;}

/* HERO + dashboard (same language) */
.hero{text-align:center;padding:10px 0 4px;}
.ringlbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate-soft);margin-bottom:12px;}
.ring-wrap{position:relative;width:228px;height:228px;margin:0 auto;}
.bigage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.bigage .num{font-family:'Fraunces',serif;font-weight:500;font-size:74px;line-height:1;letter-spacing:-.025em;}
.bigage .lbl{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--slate-soft);margin-top:6px;}
.payoff{margin-top:18px;}
.payoff .big{font-family:'Fraunces',serif;font-size:24px;font-weight:500;}
.payoff .sub{font-size:13px;color:var(--ink-soft);margin-top:5px;}
.heroqual{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--amber-deep);background:var(--amber-tint);border:1px solid #f0ddb6;padding:7px 14px;border-radius:20px;cursor:pointer;}
.vstrip{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
.vstrip .sc{font-family:'Fraunces',serif;font-size:19px;font-weight:500;color:var(--ink);}
.vstrip .band{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:11px;}
.vstrip .dot{width:3px;height:3px;border-radius:50%;background:#cfc9bd;}
.vstrip .bars{display:inline-flex;gap:2px;}
.vstrip .bars b{width:11px;height:4px;border-radius:2px;display:inline-block;}

.sysrow{display:flex;flex-direction:column;gap:11px;}
.syscard{background:var(--card);border:1px solid var(--hair);border-radius:15px;display:flex;align-items:stretch;cursor:pointer;transition:border-color .2s,transform .15s;overflow:hidden;}
.syscard:active{transform:scale(.985);}
.sysedge{width:5px;flex:none;}
.sysbody{display:flex;align-items:center;gap:13px;padding:14px 15px;flex:1;min-width:0;}
.sysglyph{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;}
.sysglyph svg{width:19px;height:19px;}
.sysdial{width:44px;height:44px;flex:none;position:relative;}
.sysdial-track{display:flex;align-items:center;justify-content:center;color:var(--mist);}
.sysdial-track svg{width:22px;height:22px;}
.pdial-track{display:flex;align-items:center;justify-content:center;color:var(--mist);background:var(--slate-tint);border-radius:50%;}
.pdial-track svg{width:26px;height:26px;}
.refbtn{margin-top:11px;width:100%;padding:11px;border:1px solid var(--mist);background:#EAF0F3;color:#3F5B6B;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.refbtn:active{transform:scale(0.99);}
.hcard{background:var(--sage-tint);border-radius:14px;padding:16px 17px;margin-bottom:14px;}
.hcard-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#48624F;margin-bottom:8px;}
.hcard-h svg{width:18px;height:18px;flex:none;}
.hcard p{font-size:12.5px;line-height:1.6;color:#4a5a50;margin:0 0 8px;}
.hcard p:last-child{margin-bottom:0;}
.hconf{border-radius:12px;padding:12px 14px;margin-bottom:16px;}
.hconf-b{font-size:13px;font-weight:600;margin-bottom:3px;}
.hconf-n{font-size:12px;line-height:1.5;color:var(--slate-soft);}
.sysdial .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;font-family:'Fraunces',serif;}
.sysinfo{flex:1;min-width:0;}
.sysname{font-size:14px;font-weight:600;}
.syssum{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
.syschev{color:#c3bdb2;font-size:17px;align-self:center;padding-right:13px;}

.drivecol{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 17px;margin-bottom:11px;}
.story{background:linear-gradient(180deg,#FBFAF7,#F6F3EC);border:1px solid var(--hair);border-radius:var(--r);padding:22px 21px;}
.story .storyeyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--slate-soft);font-weight:600;margin-bottom:14px;}
.story p{font-family:'Fraunces',serif;font-size:15px;line-height:1.62;color:var(--ink);margin-bottom:13px;font-weight:400;}
.story p:last-child{margin-bottom:0;}
.story p.muted{font-size:12.5px;font-family:'Inter';color:var(--ink-soft);line-height:1.55;}
.drivehdr{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px;}
.drivehdr .ic{width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;}
.drivehdr.help .ic{background:var(--sage-tint);color:var(--sage-deep);}
.drivehdr.hold .ic{background:var(--amber-tint);color:var(--amber-deep);}
.drivehdr.help{color:var(--sage-deep);}.drivehdr.hold{color:var(--amber-deep);}
.dl-item{display:flex;align-items:center;gap:11px;padding:8px 0;}
.dl-item:not(:last-child){border-bottom:1px solid #f3f0ea;}
.dl-name{flex:1;font-size:13px;}
.dl-bar{width:60px;height:6px;border-radius:4px;background:#efece6;position:relative;flex:none;}
.dl-bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:4px;}
.dl-val{width:46px;text-align:right;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none;}
.emptyline{font-size:12px;color:var(--ink-soft);padding:6px 0;}

.fucard{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 16px;margin-bottom:10px;border-left:4px solid var(--amber);cursor:pointer;}
.funame{font-size:14px;font-weight:600;}
.fubody{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:4px;}
.fulink{font-size:11.5px;color:var(--slate);font-weight:600;margin-top:10px;}
.fuempty{background:var(--sage-tint);border-radius:14px;padding:18px;text-align:center;font-size:12.5px;color:var(--sage-deep);}

.bm{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:17px 17px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .2s,transform .15s;}
.bm:active{transform:scale(.99);}
.bmhead{display:flex;justify-content:space-between;align-items:flex-start;}
.bmname{font-size:15px;font-weight:600;}
.bmfn{font-size:11px;color:var(--slate-soft);margin-top:2px;letter-spacing:.02em;}
.bmexp{color:#c3bdb2;font-size:15px;}
.bmval{font-family:'Fraunces',serif;font-size:26px;font-weight:500;margin:11px 0 15px;}
.bmval small{font-size:12.5px;color:var(--ink-soft);font-family:'Inter';font-weight:400;margin-left:3px;}
.seg{display:flex;gap:4px;align-items:center;position:relative;height:9px;}
.seg .s{height:9px;border-radius:5px;flex:1;}
.tick{position:absolute;top:-4px;width:2.5px;height:17px;border-radius:2px;background:var(--ink);}
.anchors{display:flex;justify-content:space-between;margin-top:8px;}
.anchors span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#a8b0a8;}
.anchors span.mid{color:var(--sage-deep);font-weight:600;}
.bmstat{font-size:11.5px;font-weight:600;margin-top:11px;display:inline-flex;align-items:center;gap:6px;}
.bmstat i{font-style:normal;width:7px;height:7px;border-radius:50%;display:inline-block;}

.panelhdr{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:18px 19px;display:flex;align-items:center;gap:15px;margin-bottom:8px;}
.panelhdr .pdial{width:56px;height:56px;position:relative;flex:none;}
.panelhdr .pdial .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:15px;font-weight:500;}
.panelhdr .pname{font-family:'Fraunces',serif;font-size:20px;font-weight:500;}
.panelhdr .pmeta{font-size:12px;color:var(--ink-soft);margin-top:3px;}

.mdval{text-align:center;padding:14px 0 4px;}
.mdval .v{font-family:'Fraunces',serif;font-size:56px;font-weight:500;line-height:1;letter-spacing:-.02em;}
.mdval .u{font-size:14px;color:var(--ink-soft);margin-top:6px;}
.mdstat{text-align:center;margin:14px 0 24px;}
.mdstat .badge{font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;display:inline-flex;align-items:center;gap:7px;}
.mdstat .badge i{font-style:normal;width:7px;height:7px;border-radius:50%;display:inline-block;}
.mdscale{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:20px 18px 18px;margin-bottom:14px;}
.mdscale .seg{height:11px;}.mdscale .seg .s{height:11px;}
.mdscale .tick{top:-4px;height:19px;width:3px;}
.mdscale .anchors{margin-top:11px;}
.mdscale .rangetxt{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--hair);}
.mdscale .rangetxt b{color:var(--ink);font-weight:600;}
.mdsection{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px 18px;margin-bottom:14px;}
.mdsection h4{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.mdsection h4 svg{width:15px;height:15px;color:var(--slate-soft);}
.mdsection p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.mdcollapse{background:var(--card);border:1px solid var(--hair);border-radius:16px;margin-bottom:11px;overflow:hidden;}
.mdcollapse summary{list-style:none;cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
.mdcollapse summary::-webkit-details-marker{display:none;}
.mdcollapse summary svg.lead{width:15px;height:15px;color:var(--slate-soft);flex:none;}
.mdcollapse summary .chev{margin-left:auto;width:16px;height:16px;color:var(--mist);transition:transform .25s;flex:none;}
.mdcollapse[open] summary .chev{transform:rotate(180deg);}
.mdcollapse .inner{padding:0 18px 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.effectpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;margin-top:2px;}
.effectpill i{font-style:normal;width:7px;height:7px;border-radius:50%;display:inline-block;}
.contribrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;}
.contribrow:not(:last-child){border-bottom:1px solid #f3f0ea;}
.contribrow .cl{font-size:12.5px;color:var(--ink-soft);}
.contribrow .cv{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
.mdprivacy{font-size:11px;color:var(--slate-soft);text-align:center;line-height:1.55;margin:6px 6px 0;padding:13px;background:var(--slate-tint);border-radius:12px;}
.mdprivacy svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;}

.privacy{margin-top:40px;background:var(--slate-tint);border:1px solid #d8e3ea;border-radius:var(--r);padding:18px 19px;}
.privtop{display:flex;align-items:center;gap:12px;cursor:pointer;}
.privlock{width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid #d2e0e7;display:flex;align-items:center;justify-content:center;color:var(--slate);flex:none;}
.privlock svg{width:17px;height:17px;}
.privttl{font-size:13.5px;font-weight:600;color:var(--slate);}
.privsub{font-size:11.5px;color:var(--slate-soft);margin-top:1px;}
.privchev{margin-left:auto;color:var(--mist);transition:transform .3s;}
.privbody{max-height:0;overflow:hidden;transition:max-height .45s ease;}
.privbody.open{max-height:360px;}
.privledger{margin-top:15px;padding-top:14px;border-top:1px solid #d8e3ea;}
.lrow{display:flex;gap:10px;font-size:12px;color:#46606e;padding:6px 0;align-items:flex-start;line-height:1.5;}
.lrow svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--slate);}
.foot{margin-top:28px;text-align:center;}
.footnote{font-size:10px;color:#9aa39c;line-height:1.65;padding:0 6px;}
.footlink{font-size:11px;color:var(--slate);font-weight:600;margin-top:11px;display:inline-block;cursor:pointer;}
</style>

<script>
/* =========================================================================
   TODO before deployment — this UI now models all 17 markers (Core 7,
   Metabolic 3, Lipid 4, Thyroid 3), aligned with the README/scoring system.
   NOTE: scores here are computed by a JavaScript PORT of the Python harness
   (harness/scoring.py + constants.py). It mirrors that logic closely but is

   scoring (sex-neutral ranges for v1; sex-specific ranges are a future step).
   ========================================================================= */

const heart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A3.5 3.5 0 0 0 12 6 3.5 3.5 0 0 0 2 8.5C2 12 6 15 12 20c2-1.7 4-3.3 5.5-4.8"/></svg>';

//   middle-best (U/UW):    Low · Optimal · High           (optimal is centered)
function anchorLabels(k){
  const shape=k?M[k][5]:null;
  if(shape===DL)return['Optimal','Healthy','Elevated'];
  if(shape===DH)return['Low','Healthy','Optimal'];
  return['Low','Optimal','High'];
}
function segBar(zone,k){
  const tiers=k?segTiers(k):['worth','healthy','optimal','healthy','worth'];
  const segs=tiers.map((t,i)=>{
    const bg = i===zone ? TIER_ACTIVE[t] : TIER_BASE[t];
    return '<div class="s" style="background:'+bg+'"></div>';
  }).join('');
  const left=((zone+0.5)/5*100);
  const an=anchorLabels(k);
  return '<div class="seg">'+segs+'<div class="tick" style="left:calc('+left+'% - 1px)"></div></div><div class="anchors"><span>'+an[0]+'</span><span class="mid">'+an[1]+'</span><span>'+an[2]+'</span></div>';
}
function statColor(s){
  if(s==='Optimal')return TIER_TEXTCOLOR.optimal;

  if(raw.activity_ord!=null)p.activity=+(raw.activity_ord/4).toFixed(3);
  ['rhr','sbp','dbp','sleep','glucose','a1c','insulin','hdl','ldl','tg','tc','hscrp','alt','ast','creatinine','testosterone','shbg','estradiol','progesterone','tsh','ft3','ft4'].forEach(k=>{const v=num(raw[k]);if(v!=null)p[k]=v;});

/* ===== YOUR LONGEVITY STORY — insight-first, deterministic ================
   Pure function of the report. Explains WHY the estimate landed where it did
   (netting of bio-age terms), surfaces cross-system clustering and tension,
   and notes what is distinctive WITHIN the profile. Fixed templates; only
   values/names interpolated. Describes the MODEL ARITHMETIC, never the user's
   physiology or future. No prediction, body-causation, recommendation, or
   condition names. Every sentence must add what the cards cannot show.
   Target 2-4 short paragraphs. ========================================= */
const STORY_DRIVER_MIN=0.5;
const STORY_NET_CLEAR=2.0;
const METAB_CLUSTER=new Set(['glucose','a1c','insulin','tg','hdl','ldl','tc','hscrp','bmi','whtr']);
const CARDIO_SET=new Set(['rhr','sbp','dbp']);
function longevityStory(R){
  const out=[];const age=R.prof.age;const bio=Math.round(R.ba.age);const d=R.ba.delta;const a=Math.abs(d);const yr=(n)=>n===1?'year':'years';
  const terms=R.terms;const down=[],up=[];let downSum=0,upSum=0;
  Object.keys(terms).forEach(k=>{const y=terms[k];
    if(y<0){downSum+=-y; if(-y>=0.15)down.push({k,n:M[k][0],mag:-y});}
    else if(y>0){upSum+=y; if(y>=0.15)up.push({k,n:M[k][0],mag:y});}});
  down.sort((x,y)=>y.mag-x.mag);up.sort((x,y)=>y.mag-x.mag);
  const present=R.ps.map(p=>({p,name:PANEL_META[p].name,disp:R.sys[p]?R.sys[p].disp:null})).filter(x=>x.disp!=null);
  const names=(arr,n)=>listJoin(arr.slice(0,n).map(x=>x.n));
  const RSQUO=String.fromCharCode(8217);
  // "tension" = both directions carry real weight relative to the net result
  const bothSidesReal = downSum>=0.75 && upSum>=0.75;

  // ---- SPINE: explain the estimate via netting ----
  if(present.length<=1 || (down.length===0&&up.length===0&&downSum<0.5&&upSum<0.5)){
    out.push('Your biological age estimate of '+bio+' lands '+(a<1?'close to':a.toFixed(0)+' '+yr(Math.round(a))+(d<0?' below':' above'))+' your actual age of '+age+'.');
  } else if(bothSidesReal&&a<STORY_NET_CLEAR){
    // TENSION: both directions carry weight and they roughly cancel
    const dn=down.length?names(down,2):'several favorable markers';
    const u=up.length?names(up,2):'several less-favorable markers';
    out.push('Your biological age estimate of '+bio+' lands close to your actual age of '+age+' because two forces are roughly cancelling out: '+dn+' '+(down.length>1?'are':'is')+' pulling it younger, while '+u+' '+(up.length>1?'are':'is')+' pushing it older.');
  } else if(d<0){
    const lead=down.length?names(down,3):'a broad set of markers sitting in healthy ranges';
    const tail=upSum>=0.75&&up.length?' The main thing pulling the other way is '+up[0].n+', though it doesn'+RSQUO+'t offset them.':' Little of weight is pulling in the other direction.';
    out.push('Your biological age estimate of '+bio+' lands '+(a<1?'just below':a.toFixed(0)+' '+yr(Math.round(a))+' below')+' your actual age of '+age+', driven mostly by '+lead+'.'+tail);
  } else {
    const lead=up.length?names(up,3):'a broad set of markers sitting above their optimal range';
    const tail=downSum>=0.75&&down.length?' Working the other way, '+down[0].n+' is pulling the estimate younger, but it doesn'+RSQUO+'t fully offset the rest.':'';

async function runFullFHE(){
  if(!PROFILE){resetTo(fheErrorView('No profile submitted.'));return;}
  resetTo(fheProgressView());
  const started=Date.now();
  const tick=setInterval(()=>{const el=document.getElementById('fhe_elapsed');if(el)el.textContent='elapsed '+Math.round((Date.now()-started)/1000)+'s';},1000);
  try{
    const resp=await fetch('/api/fhe/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(PROFILE)});
    if(resp.status===429){ const j=await resp.json().catch(()=>({error:'busy'})); throw new Error(j.error||'busy'); }
    if(!resp.body) throw new Error('no response stream (HTTP '+resp.status+')');
    const reader=resp.body.getReader(),tdec=new TextDecoder();let buf='',result=null,errored=null;
    for(;;){
      const {done,value}=await reader.read(); if(done)break;
      buf+=tdec.decode(value,{stream:true});
      let nl; while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1); if(!line)continue;
        const ev=JSON.parse(line);
        if(ev.stage==='result')result=ev;
        else if(ev.stage==='error')errored=ev.error;
        else if(ev.status==='start')fheSetStep(ev.stage,'run');
        else if(ev.status==='done')fheSetStep(ev.stage,'done',ev.ms);
      }
    }
    clearInterval(tick);
    if(errored)throw new Error(errored);
    if(!result)throw new Error('pipeline returned no result');
    FHE=result; REPORT=buildReportFromFHE(result,PROFILE);
    resetTo(overview());

  ps.forEach(p=>{ const raw=j.fhe.panels[p];
    if(raw==null){ sys[p]={raw:null,disp:null,tracking:true}; }
    else { sys[p]={raw:raw,disp:Math.round(displayScore(raw)),tracking:false}; } });
  const age=j.fhe.biological_age, delta=age-(prof.age||0);
  const scored=ps.filter(p=>sys[p].raw!=null);
  let wsum=0,acc=0; scored.forEach(p=>{wsum+=PANEL_COMPOSITE[p];acc+=PANEL_COMPOSITE[p]*sys[p].raw;});
  const comp=wsum?Math.max(0,Math.min(100,acc/wsum)):null;

  const terms={};

  <div class="foot"><div class="footnote">Local FHE app. Wellness scores and biological age are computed under real CKKS homomorphic encryption (ring 65536, 128-classic) on this machine; standardization, banding and display are client-side by design. Not a medical device, not a diagnosis, and ranges are illustrative. Always consult a qualified provider.</div></div>`;
}

/* ===== biomarker card + panel + marker detail ===== */
function bmCard(k){const m=M[k];
  if(isInformational(PROFILE,k)){
    return '<div class="bm" onclick="goMarker(\''+k+'\')"><div class="bmhead"><div><div class="bmname">'+m[0]+'</div><div class="bmfn">'+m[1]+'</div></div><div class="bmexp">⤢</div></div>'+
      '<div class="bmval">'+fmtVal(k)+(m[2]?'<small>'+m[2]+'</small>':'')+'</div>'+
      '<div class="bmstat" style="color:#5E7E92"><i style="background:#9DBED0"></i>Shown for reference</div></div>';
  }
  const z=standardize(k,PROFILE[k],PROFILE);const zone=zoneOf(k,z);const stat=markerStat(k,z);const sc=statColor(stat);
  return '<div class="bm" onclick="goMarker(\''+k+'\')"><div class="bmhead"><div><div class="bmname">'+m[0]+'</div><div class="bmfn">'+m[1]+'</div></div><div class="bmexp">⤢</div></div>'+
    '<div class="bmval">'+fmtVal(k)+(m[2]?'<small>'+m[2]+'</small>':'')+'</div>'+segBar(zone,k)+'<div class="bmstat" style="color:'+sc.c+'"><i style="background:'+sc.d+'"></i>'+stat+'</div></div>';}
function fmtVal(k){const v=PROFILE[k];return (Number.isInteger(v)?v:(+v).toFixed(k==='whtr'?2:1));}
function goPanel(p){const m=PANEL_META[p];const keys=panelPresent(PROFILE,p);const S=REPORT.sys[p];
  let cards=keys.map(k=>bmCard(k)).join('');
  let hdr;
  if(S.tracking){
    hdr='<div class="panelhdr"><div class="pdial pdial-track">'+m.glyph+'</div><div><div class="pname">'+m.name+'</div><div class="pmeta">'+keys.length+' marker'+(keys.length>1?'s':'')+' · needs context to score</div></div></div>';
  } else {
    const sc=S.disp;const dc=sc>=85?'#7C9885':'#3F5B6B';
    hdr='<div class="panelhdr"><div class="pdial">'+ringSVG(sc,dc,56,5)+'<div class="pct">'+sc+'</div></div><div><div class="pname">'+m.name+'</div><div class="pmeta">'+keys.length+' markers · '+bandOf(sc)+'</div></div></div>';
  }
  const html='<div class="nav"><button class="back" onclick="pop()">'+BACK+' Results</button><span class="navtitle">'+m.name+'</span><span class="navspacer"></span></div>'+hdr+
    (p==='hormone'?hormoneInfoCard()+hormoneConfidenceBand():'')+cards;
  render(html,'push');}
/* Hormone educational card — first-class, rendered before any hormone scores,
   so informational states read as rigor, not missing functionality. */
function hormoneInfoCard(){
  return '<div class="hcard"><div class="hcard-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>How hormones are interpreted</div>'+
    '<p>Hormone levels are unusually context-dependent. What counts as a typical value can vary substantially with sex, age, menstrual cycle phase, menopause status, pregnancy, hormonal contraception, and hormone therapies.</p>'+
    '<p>Because of that, VitalVault scores a hormone only when it has enough context to interpret it meaningfully. When it doesn’t, the value is shown <strong>for reference</strong> rather than scored — that’s a deliberate choice to avoid misleading results, not a gap. Hormones are kept from influencing your biological-age estimate. Illustrative and non-diagnostic.</p></div>';
}
/* Hormone panel confidence: High / Moderate / Low based on how much of the
   panel is actually interpretable (scored), with an explanation naming the
   missing context. Reuses the scored-vs-informational distinction. */
function hormoneConfidenceBand(){
  const keys=panelPresent(PROFILE,'hormone');if(!keys.length)return '';
  const scored=keys.filter(k=>isScorable(PROFILE,k));
  const frac=scored.length/keys.length;
  let band,note;
  // gather recoverable reasons among informational hormone markers
  const infoReasons=new Set(keys.filter(k=>!isScorable(PROFILE,k)).map(k=>isContextSpecific(k)?hormoneMode(PROFILE,k).reason:'sex'));
  if(frac>=0.99){band='High';note='All entered hormones have enough context to interpret.';}
  else if(frac>0){band='Moderate';
    note='Testosterone and SHBG are interpreted; '+(infoReasons.has('sex')?'add your sex':infoReasons.has('phase')?'adding your cycle phase':'more context')+
      (infoReasons.has('phase')?' would let us interpret estradiol and progesterone.':infoReasons.has('sex')?' to interpret the rest.':' would let us interpret the rest.');
  }
  else {band='Low';note=infoReasons.has('sex')?'Add your sex to interpret these hormones.':'These hormones are shown for reference given the context provided.';}
  const col=band==='High'?'#48624F':band==='Moderate'?'#5E7E92':'#9A7426';
  const bg=band==='High'?'#EDF2EE':band==='Moderate'?'#EAF0F3':'#FAF0DC';
  return '<div class="hconf" style="background:'+bg+'"><div class="hconf-b" style="color:'+col+'">Interpretation confidence · '+band+'</div><div class="hconf-n">'+note+'</div></div>';
}
function goAllMarkers(){let html='<div class="nav"><button class="back" onclick="pop()">'+BACK+' Results</button><span class="navtitle">All biomarkers</span><span class="navspacer"></span></div>';
  REPORT.ps.forEach(p=>{html+='<div class="eyebrow" style="margin-top:24px">'+PANEL_META[p].name+'</div>';panelPresent(PROFILE,p).forEach(k=>html+=bmCard(k));});render(html,'push');}
function goMarker(k){const m=M[k];const panelName=PANEL_META[m[7]].name;const C=m[10];
  const ic=(p)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
  const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  // PRESENT-BUT-UNSCORED (informational): value shown for reference, explained,
  // with a recovery prompt — no score, no scale, no bio-age effect.
  if(isInformational(PROFILE,k)){
    // reason-aware message; recovery prompt ONLY for recoverable reasons
    let reasonObj={reason:'sex'};
    if(isContextSpecific(k))reasonObj=hormoneMode(PROFILE,k);
    const rsn=reasonObj.reason;
    const REASON_TEXT={
      sex:'This marker is interpreted differently by sex, so we need your sex to score it accurately. Your value is shown here for reference.',
      phase:'Estradiol and progesterone vary several-fold across the menstrual cycle, so a value can’t be meaningfully scored without knowing your cycle phase. It’s shown here for reference.',
      pregnancy:'Pregnancy substantially changes hormone ranges — well beyond what general reference ranges capture — so this value is shown for reference rather than scored.',
      contraception:'Hormonal contraception sets these levels directly, so the value reflects your medication rather than your own cycle. It’s shown here for reference.',
      hrt:'This value reflects your hormone therapy rather than your body’s own production, so it’s shown for reference rather than scored.',
      testosterone:'This value reflects your testosterone therapy rather than endogenous production, so it’s shown for reference.',
      other:'Given the hormone medication noted, this value is shown for reference rather than scored.',
      context:'This marker needs more context to interpret, so it’s shown here for reference rather than scored.'
    };
    const reason=REASON_TEXT[rsn]||REASON_TEXT.context;
    const recoverable=RECOVERABLE_REASONS.has(rsn);
    const recoverBtn = recoverable
      ? (rsn==='sex' ? '<button class="refbtn" onclick="goStep1()">Add your sex to score this</button>'
                     : '<button class="refbtn" onclick="goStep1()">Add your cycle phase to score this</button>')
      : '';
    const collapsibleI=(icon,title,content)=>'<details class="mdcollapse"><summary>'+icon.replace('<svg ','<svg class="lead" ')+title+chev+'</summary><div class="inner">'+content+'</div></details>';
    let edu='';
    if(C){
      edu=collapsibleI(ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),'What this measures',C.measures)+
          collapsibleI(ic('<path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/>'),'Why it matters',C.why)+
          collapsibleI(ic('<path d="M12 3v18M5 10l7-7 7 7"/>'),'What influences it',C.influences)+
          collapsibleI(ic('<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>'),'Important caveats',C.caveats);
    }
    const html='<div class="nav"><button class="back" onclick="pop()">'+BACK+' '+panelName+'</button><span class="navtitle">'+m[0]+'</span><span class="navspacer"></span></div>'+
      '<div class="mdval"><div class="v">'+fmtVal(k)+'</div><div class="u">'+(m[2]||'')+'</div></div>'+
      '<div class="mdstat"><span class="badge" style="background:#EAF0F3;color:#5E7E92"><i style="background:#9DBED0"></i>Shown for reference</span></div>'+
      '<div class="mdsection"><h4>'+ic('<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>')+'Shown for reference</h4><p>'+reason+'</p>'+
        recoverBtn+'</div>'+
      edu+
      '<div class="mdprivacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>In the full product, this value stays on your device — only its encrypted contribution is used.</div>';
    render(html,'push');return;
  }
  const z=standardize(k,PROFILE[k],PROFILE);const zone=zoneOf(k,z);const stat=markerStat(k,z);const sc=statColor(stat);
  const yrs=REPORT.terms[k]||0;
  const badgeBg=stat==='Optimal'?'var(--sage-tint)':stat==='Healthy / Typical'?'#EAF1DF':'var(--amber-tint)';
  const head='<div class="nav"><button class="back" onclick="pop()">'+BACK+' '+panelName+'</button><span class="navtitle">'+m[0]+'</span><span class="navspacer"></span></div>'+
    '<div class="mdval"><div class="v">'+fmtVal(k)+'</div><div class="u">'+(m[2]||'')+'</div></div>'+
    '<div class="mdstat"><span class="badge" style="background:'+badgeBg+';color:'+sc.c+'"><i style="background:'+sc.d+'"></i>'+stat+'</span></div>'+
    '<div class="mdscale">'+segBar(zone,k)+'</div>';
  let body;
  if(C){
    // Favorability is derived from the bio-age TERM SIGN (which already encodes
    // marker direction): negative term = favorable, positive = unfavorable,
    // near-zero = neutral. This keeps the score line internally consistent —
    // a healthy marker never reads as "positive" and "age-increasing" at once.
    const favorable=yrs<=-0.05, unfavorable=yrs>=0.15;
    const effect=favorable?{w:'Favorable effect',bg:'var(--sage-tint)',c:'#48624F',d:'#7C9885'}
                :unfavorable?{w:'Unfavorable effect',bg:'var(--amber-tint)',c:'#9A7426',d:'#E2A33C'}
                :{w:'Neutral effect',bg:'var(--slate-tint)',c:'#5E7E92',d:'#9DBED0'};
    // descriptive, badge-consistent score sentence (no signed numbers, no contradiction)
    let scoreLine;
    if(stat==='Optimal'){
      scoreLine='Your '+m[0]+' of '+fmtVal(k)+(m[2]?' '+m[2]:'')+' sits in the optimal range, supporting a healthy '+panelName+' score.';
    } else if(stat==='Healthy / Typical'){
      const dir=zone>2?'toward the higher end of':zone<2?'toward the lower end of':'within';
      scoreLine='Your '+m[0]+' of '+fmtVal(k)+(m[2]?' '+m[2]:'')+' sits '+dir+' the typical range. It has a modest influence on your '+panelName+' score.';
    } else {
      const dir=zone>2?'above':'below';
      scoreLine='Your '+m[0]+' of '+fmtVal(k)+(m[2]?' '+m[2]:'')+' sits '+dir+' the typical range, which lowered your '+panelName+' score and may be worth a closer look.';
    }
    const bioNote=favorable?'Counts in your favor for your biological-age estimate.'
                 :unfavorable?'Currently adds slightly to your biological-age estimate.'
                 :'Little to no effect on your biological-age estimate.';
    body=
      '<div class="mdsection"><h4>'+ic('<path d="M3 12h4l3-8 4 16 3-8h4"/>')+'How it affected your results</h4>'+
        '<p>'+scoreLine+'</p>'+
        '<div class="effectpill" style="background:'+effect.bg+';color:'+effect.c+'"><i style="background:'+effect.d+'"></i>'+effect.w+'</div>'+
        '<p style="margin-top:9px">'+bioNote+'</p></div>'+
      '<div class="mdsection"><h4>'+ic('<path d="M4 7h16M4 12h16M4 17h10"/>')+'Where your value sits</h4>'+
        '<p><b style="font-weight:600">Typical range:</b> '+C.typical+'<br><b style="font-weight:600">Optimal range:</b> '+C.optimal+'</p></div>'+
      collapsible(ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),'What this measures',C.measures)+
      collapsible(ic('<path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/>'),'Why it matters',C.why)+
      collapsible(ic('<path d="M12 3v18M5 10l7-7 7 7"/>'),'What influences it',C.influences)+
      collapsible(ic('<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>'),'Important caveats',C.caveats);
    function collapsible(icon,title,content){return '<details class="mdcollapse"><summary>'+icon.replace('<svg ','<svg class="lead" ')+title+chev+'</summary><div class="inner">'+content+'</div></details>';}
  } else {
    body=
      '<div class="mdscale"><div class="rangetxt">Typical range <b>'+m[9]+'</b></div></div>'+
      '<div class="mdsection"><h4>'+ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>')+'What this measures</h4><p>'+m[8]+'</p></div>'+
      '<div class="mdsection"><h4>'+ic('<path d="M3 12h4l3-8 4 16 3-8h4"/>')+'How it shapes your results</h4>'+
        '<div class="contribrow"><span class="cl">Effect on biological age</span><span class="cv" style="color:'+(yrs<=0?'#48624F':'#9A7426')+'">'+(yrs<=0?'−':'+')+Math.abs(yrs).toFixed(2)+' yr</span></div></div>';
  }
  const priv='<div class="mdprivacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>In the full product, this value stays on your device — only its encrypted contribution is used.</div>';
  render(head+body+priv,'push');}
function goMarkerByName(sys,k){goPanel(sys);setTimeout(()=>goMarker(k),360);}
let privOpen=false;function togglePriv(e){e.stopPropagation();privOpen=!privOpen;document.getElementById('pbody').classList.toggle('open',privOpen);document.getElementById('pchev').style.transform=privOpen?'rotate(180deg)':'';}

render(welcome(),'init');
</script>
