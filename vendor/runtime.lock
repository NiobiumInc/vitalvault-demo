# vendor/runtime.lock — pin + integrity for the native FHE runtime.
#
# The runtime (OpenFHE + FHETCH + fhetch_driver + autofacade + headers) is NOT
# committed. It is provisioned into the git-ignored vendor/fhe_runtime/ by
# serve/fetch_runtime.sh, which builds it FROM SOURCE at the pinned commit below
# (a shallow clone into .cache/ — requires internet unless already cached).
#
# Keep this in sync with vendor/fhe_dsl (same commit).

niobium_client_url    = https://github.com/NiobiumInc/niobium-client.git
niobium_client_commit = f21df4e8fa2c9ceae0bd1a905f08d6a8fe69709d
arch                  = darwin-arm64
openfhe_version       = 1.4.2

# --- OPTIONAL prebuilt archive (phase 2) ------------------------------------
# A downloadable prebuilt runtime is a LATER, approval-gated option: it requires
# Brad/legal sign-off to redistribute the built OpenFHE + FHETCH binaries and a
# confirmed hosting location. Until archive_url is set, fetch_runtime.sh builds
# from source (the supported path). When enabled, fetch_runtime.sh will download
# the archive and verify archive_sha256 instead of building.
archive_url           =
archive_sha256        =
